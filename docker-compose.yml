name: pumpfun-bundle-detector

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pfbd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pfbd}
      POSTGRES_DB: pfbd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfbd -d pfbd"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    command: ["python", "-m", "app.main", "bot"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pfbd:${POSTGRES_PASSWORD:-pfbd}@postgres:5432/pfbd
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The bot has no HTTP listener; the image healthcheck targets the API.
    healthcheck:
      disable: true
    restart: unless-stopped

  api:
    build: .
    command: ["python", "-m", "app.main", "api", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pfbd:${POSTGRES_PASSWORD:-pfbd}@postgres:5432/pfbd
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
