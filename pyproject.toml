[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpfun-bundle-detector"
version = "0.1.0"
description = "Pump.fun on-chain forensics engine: wallet clustering, funding tracing and bundle detection for Pump.fun / PumpSwap launches"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "discord.py>=2.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.0",
    "networkx>=3.3",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "matplotlib>=3.8.0",
    "websockets>=12.0",
    "base58>=2.1.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
pfbd = "scripts.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: `str, Enum` is kept deliberately — StrEnum changes f-string rendering
# from `Name.MEMBER` to the bare value, which several report strings rely on.
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
# `app/discord/` would otherwise shadow the third-party `discord` library in
# isort's first-party detection. Absolute imports resolve correctly at runtime;
# this only teaches the import sorter which group the library belongs to.
known-third-party = ["discord"]
known-first-party = ["app", "scripts", "tests"]
